apiVersion: v1
kind: ConfigMap
metadata:
  name: shade-config
  namespace: default
data:
  THETA: "0.25"
  LEASE_DURATION: "6.0"
  RHO_MIN: "0.30"
  TAU_LIVE: "3.0"
  V_MAX: "5.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shade-fleet
  namespace: default
  labels:
    app: shade-node
spec:
  replicas: 5
  selector:
    matchLabels:
      app: shade-node
  template:
    metadata:
      labels:
        app: shade-node
    spec:
      containers:
      - name: shade-agent
        image: shade-protocol:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9999
          name: gossip
          protocol: UDP
        envFrom:
        - configMapRef:
            name: shade-config
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shade-headless
  namespace: default
  labels:
    app: shade-node
spec:
  clusterIP: None
  selector:
    app: shade-node
  ports:
  - port: 8080
    name: http
  - port: 9999
    name: gossip
    protocol: UDP
